{% extends "base.html" %}

{% block title %}Contact{% endblock %}

{% block content %}
<h1>Contact Me</h1>

<p style="color: #666; margin-bottom: 30px;">
    Have a question or project idea? I'd love to hear from you. Fill out the form below and I'll get back to you soon.
</p>

<div style="max-width: 600px;">
    <form method="post" style="background: #f8f9fa; padding: 30px; border-radius: 8px;">
        {% csrf_token %}
        
        <div style="margin-bottom: 20px;">
            <label for="name" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Name:</label>
            <input type="text" id="name" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label for="email" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Email:</label>
            <input type="email" id="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em;">
        </div>
        
        <div style="margin-bottom: 20px;">
            <label for="message" style="display: block; margin-bottom: 8px; font-weight: 600; color: #333;">Message:</label>
            <textarea id="message" name="message" rows="6" required style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; font-size: 1em; font-family: Arial, sans-serif;"></textarea>
        </div>
        
        <button type="submit" style="padding: 12px 30px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 1em; transition: background 0.3s;">
            Send Message
        </button>
    </form>
</div>

<a href="/" class="back-link">Back to Portfolio</a>
{% endblock %}
